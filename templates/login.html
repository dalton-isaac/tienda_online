{% extends "base.html" %}

{% block titulo %}Iniciar Sesión{% endblock %}

{% block content %}
    <div class="auth-card">
        <div class="card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle" style="font-size: 3rem; color: var(--color-primario);"></i>
                    <h2 class="mt-2">Iniciar Sesión</h2>
                    <p class="text-muted">Ingresa a tu cuenta para continuar</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-envelope me-1"></i>Correo electrónico
                        </label>
                        <input type="email" class="form-control" name="email"
                               placeholder="tu@correo.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-lock me-1"></i>Contraseña
                        </label>
                        <input type="password" class="form-control" name="password"
                               placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    ¿No tienes cuenta?
                    <a href="{{ url_for('registro') }}" style="color: var(--color-primario); font-weight: 600;">
                        Regístrate
                    </a>
                </p>
            </div>
        </div>
    </div>
{% endblock %}
