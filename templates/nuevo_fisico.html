{% extends "base.html" %}

{% block titulo %}Nuevo Producto Físico{% endblock %}

{% block content %}
    <a href="{{ url_for('inicio') }}" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left me-1"></i>Volver al catálogo
    </a>

    <div class="card">
        <div class="card-body">
            <h2 class="mb-4">
                <i class="bi bi-box-seam me-2" style="color: var(--color-primario);"></i>
                Nuevo Producto Físico
            </h2>

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" class="form-control" name="codigo" placeholder="Ej: FIS002" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="nombre" placeholder="Nombre del producto" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio base ($)</label>
                        <input type="number" step="0.01" class="form-control" name="precio_base" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Stock inicial</label>
                        <input type="number" class="form-control" name="stock" placeholder="0" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Peso (kg)</label>
                        <input type="number" step="0.01" class="form-control" name="peso_kg" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Costo de envío por kg ($)</label>
                        <input type="number" step="0.01" class="form-control" name="costo_envio_por_kg" placeholder="0.00" required>
                    </div>
                </div>

                <!-- Campo de imagen -->
                <div class="mb-4">
                    <label class="form-label">Imagen del producto</label>
                    <input type="file" class="form-control" name="imagen" accept="image/*">
                    <small class="text-muted">
                        <i class="bi bi-info-circle me-1"></i>
                        Formatos permitidos: PNG, JPG, JPEG, GIF, WEBP. Opcional.
                    </small>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i>Crear producto
                </button>
            </form>
        </div>
    </div>
{% endblock %}
